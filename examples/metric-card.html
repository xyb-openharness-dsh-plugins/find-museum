<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区指标卡：独立翻面与等比折线</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
body{margin:0;background:#f0f4f1}.wb-root{max-width:1120px;margin:24px auto;padding:28px;border-radius:22px}h1{font-size:1.65em;display:flex;align-items:center;margin:0 0 8px}p{color:var(--wb-muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metric{position:relative;min-width:0;min-height:232px;border:1px solid var(--wb-line);border-radius:18px;background:var(--wb-surface);color:var(--wb-ink);padding:0;text-align:left;perspective:1000px}.inner{display:block;position:relative;min-height:232px;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.7,.2,1)}.metric[aria-pressed=true] .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg);background:var(--wb-mint);border-radius:inherit}.value{font-size:1.65em;font-weight:650}.delta{color:var(--wb-mint-ink)}.hint{font-size:.82em;color:var(--wb-muted)}.spark{display:block;width:min(100%,320px);height:62px;flex:0 0 62px;margin:6px 0}.dates{display:flex;justify-content:space-between;gap:10px;width:min(100%,320px);font-size:.76em;color:var(--wb-muted)}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--wb-line)}summary{cursor:pointer;min-height:44px}button{border:1px solid var(--wb-line);border-radius:12px;background:var(--wb-surface);color:var(--wb-ink);padding:6px 14px}
@container(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@container(max-width:480px){.grid{grid-template-columns:1fr}.wb-root{padding:16px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head>
<body><main class="wb-root" id="demo"><h1><svg class="wb-flower" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="13" rx="8" ry="12" fill="#e88755"/><ellipse cx="24" cy="13" rx="8" ry="12" fill="#e7a7bb" transform="rotate(72 24 24)"/><ellipse cx="24" cy="13" rx="8" ry="12" fill="#8fc7ac" transform="rotate(144 24 24)"/><ellipse cx="24" cy="13" rx="8" ry="12" fill="#96bfd6" transform="rotate(216 24 24)"/><ellipse cx="24" cy="13" rx="8" ry="12" fill="#e3cc7b" transform="rotate(288 24 24)"/><circle cx="24" cy="24" r="6" fill="#fff7d6"/></svg>近期记录，清楚回看</h1>
<p>虚构演示数据。点击卡片看最近五次折线；多张卡片各自保持状态。走势不用于诊断。</p><div class="toolbar"><button type="button" id="font" aria-pressed="false">切换大字</button><button type="button" id="reset">全部返回数值面</button></div><div class="grid" id="cards"></div><details><summary>查看等价记录表</summary><div style="overflow:auto"><table><thead><tr><th>指标</th><th>日期</th><th>数值</th><th>单位</th></tr></thead><tbody id="rows"></tbody></table></div></details></main>
<script>
const records=[{id:'weight',label:'体重',unit:'kg',values:[57,55.6,54.1,52.8,51.4]},{id:'bmi',label:'BMI',unit:'kg/m²',values:[19.7,19.2,18.7,18.3,17.8]},{id:'energy',label:'摄入能量',unit:'kcal',values:[1450,1380,1280,1320,1200]}];
const dates=['06-02','06-16','07-01','07-15','08-01'];
function chart(record){const low=Math.min(...record.values),high=Math.max(...record.values),span=high-low||1;const coords=record.values.map((value,i)=>({x:18+i*284/4,y:42-(value-low)/span*27}));return `<svg class="spark" viewBox="0 0 320 62" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${record.label}最近五次趋势"><path d="M18 49H302" stroke="#cadbd0" stroke-width="1.5" vector-effect="non-scaling-stroke"/><path d="${coords.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')}" fill="none" stroke="#52856d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4.2" fill="#52856d" stroke="#fff" stroke-width="2.4" vector-effect="non-scaling-stroke"><title>${dates[i]}：${record.values[i]} ${record.unit}</title></circle>`).join('')}</svg><span class="dates"><span>${dates[0]}</span><span>${dates.at(-1)}</span></span>`}
const cards=document.getElementById('cards');
for(const record of records){const button=document.createElement('button');button.type='button';button.className='metric';button.dataset.id=record.id;button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',record.label+'，点击查看趋势');const delta=+(record.values.at(-1)-record.values.at(-2)).toFixed(1);button.innerHTML=`<span class="inner"><span class="face front"><span>${record.label}</span><span class="value">${record.values.at(-1)} ${record.unit}</span><span class="delta">${delta<0?'↓':'↑'} ${Math.abs(delta)} · 较前次</span><span class="hint">${dates.at(-1)} · 虚构记录</span></span><span class="face back" aria-hidden="true"><b>${record.label} · 最近五次</b>${chart(record)}<span class="hint">回顾已确认记录 · 点击返回</span></span></span>`;cards.append(button);for(let i=0;i<record.values.length;i++){const row=document.createElement('tr');for(const value of [record.label,dates[i],record.values[i],record.unit]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}document.getElementById('rows').append(row)}}
function setFlipped(button,flipped){button.setAttribute('aria-pressed',String(flipped));button.querySelector('.front').setAttribute('aria-hidden',String(flipped));button.querySelector('.back').setAttribute('aria-hidden',String(!flipped));button.setAttribute('aria-label',records.find(r=>r.id===button.dataset.id).label+(flipped?'，趋势已展开，点击返回':'，点击查看趋势'))}
cards.addEventListener('click',event=>{const button=event.target.closest('.metric');if(button)setFlipped(button,button.getAttribute('aria-pressed')!=='true')});
document.getElementById('reset').onclick=()=>cards.querySelectorAll('.metric').forEach(button=>setFlipped(button,false));
document.getElementById('font').onclick=event=>{const large=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(large));document.getElementById('demo').dataset.font=large?'large':'standard';event.currentTarget.textContent=large?'切换标准字':'切换大字'};
</script></body></html>
